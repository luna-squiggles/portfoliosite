name: Process Images
on:
  push:
    paths:
      - 'assets/**/*.png'
      - 'assets/**/*.jpg'
      - 'assets/**/*.jpeg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          npm install sharp
          
      - name: Create dist directory
        run: mkdir -p dist
          
      - name: Create process-images.js
        run: |
          cat << 'EOF' > process-images.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function processImages() {
            const assetsDir = 'assets';
            const files = fs.readdirSync(assetsDir);
            const imageFiles = files.filter(file => 
              /\.(jpg|jpeg|png)$/i.test(file)
            );
            
            const photoData = [];
            
            for (const file of imageFiles) {
              const inputPath = path.join(assetsDir, file);
              const webpFilename = file.replace(/\.(jpg|jpeg|png)$/i, '.webp');
              const outputPath = path.join(assetsDir, webpFilename);
              
              const metadata = await sharp(inputPath).metadata();
              
              await sharp(inputPath)
                .webp({ quality: 80 })
                .resize({
                  width: Math.min(metadata.width, 2000),
                  height: Math.min(metadata.height, 2000),
                  fit: 'inside',
                  withoutEnlargement: true
                })
                .toFile(outputPath);
              
              photoData.push({
                src: `/assets/${webpFilename}`,
                alt: file.replace(/\.[^/.]+$/, "").replace(/-/g, " "),
              });
              
              fs.unlinkSync(inputPath);
            }
            
            const photoDataContent = `const photoData = ${JSON.stringify(photoData, null, 2)};`;
            fs.writeFileSync('dist/photos.js', photoDataContent);
          }
          
          processImages().catch(console.error);
          EOF

      - name: Process Images
        run: node process-images.js
        
      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ dist/photos.js
          git commit -m "Automatically convert images to WebP and update photos.js" || echo "No changes to commit"
          git push origin ${GITHUB_REF#refs/heads/} || echo "No changes to push"
