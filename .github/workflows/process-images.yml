name: Process Images
on:
  push:
    paths:
      - 'assets/**/*.png'
      - 'assets/**/*.jpg'
      - 'assets/**/*.jpeg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          npm install sharp
          
      - name: Create dist directory
        run: mkdir -p dist
          
      - name: Process Images
        run: node process-images.js
        
      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ dist/photos.js
          git commit -m "Automatically convert images to WebP and update photos.js" || echo "No changes to commit"
          git push origin ${GITHUB_REF#refs/heads/} || echo "No changes to push"
